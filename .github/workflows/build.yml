name: build-bundle

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests
        run: python3 tests/test_shortcuts.py

      - name: Every dispatched function and helper action exists
        run: |
          fail=0
          for f in $(grep -oE 'cmd_[a-z_]+' src/deckdroid | sort -u); do
            grep -q "^$f() {" src/deckdroid || { echo "undefined: $f"; fail=1; }
          done
          for a in $(grep -oE 'as_root [a-z-]+' src/deckdroid | awk '{print $2}' | sort -u); do
            grep -q "^  $a)" src/deckdroid-root || { echo "no helper action: $a"; fail=1; }
          done
          grep -q 'waydroid session start' src/deckdroid || { echo "launcher never starts a session"; fail=1; }
          exit $fail

      - name: Shell syntax
        run: |
          for f in src/deckdroid src/deckdroid-root src/deckdroid-env install.sh build/*.sh; do
            bash -n "$f" && echo "ok $f"
          done

      - name: Build SteamOS-matched image
        run: docker build -t deckdroid-build -f build/Dockerfile build/

      - name: Build bundle
        run: |
          # The container builds as an unprivileged user; make the bind mount writable by it.
          mkdir -p out && chmod 777 out
          docker run --rm \
            -v "$PWD/build:/work/build:ro" \
            -v "$PWD/out:/out" \
            deckdroid-build \
            bash /work/build/build-bundle.sh

      - name: Verify the bundle is actually relocatable
        run: bash build/verify-bundle.sh out/deckdroid-bundle-x86_64.tar.gz

      - name: Package launcher scripts
        run: |
          # Stamp the build so `deckdroid doctor` can say which commit is
          # deployed -- otherwise "did my fix actually ship?" is unanswerable.
          echo "${GITHUB_SHA:0:7} ($(date -u +%Y-%m-%dT%H:%M:%SZ))" > src/VERSION
          tar -C src -czf out/deckdroid-tools.tar.gz .
          rm -f src/VERSION

      - uses: actions/upload-artifact@v4
        with:
          name: deckdroid-bundle
          path: out/*

      - name: Attach to release
        if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" out/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish rolling 'latest' release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/* \
            --title "Latest bundle" \
            --notes "Rolling build of the Waydroid bundle from $GITHUB_SHA."
        env:
          GH_TOKEN: ${{ github.token }}
